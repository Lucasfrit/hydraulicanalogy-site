name: Publish Hydraulic Analogy

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Read the published site source
        uses: actions/checkout@v6
        with:
          repository: Lucasfrit/inertance-site
          ref: main
          path: upstream
          persist-credentials: false
      - name: Prepare visitor files for this domain
        run: python3 tools/prepare_site.py upstream _site
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Keep HTTPS enforced after certificate issuance
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          certificate_state=$(gh api "repos/$GH_REPO/pages" --jq '.https_certificate.state // "pending"')
          if [ "$certificate_state" = "approved" ]; then
            gh api --method PUT "repos/$GH_REPO/pages" -F https_enforced=true
          else
            echo "Certificate provisioning is $certificate_state; HTTPS enforcement will be checked on the next run."
          fi
